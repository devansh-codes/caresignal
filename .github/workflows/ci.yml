name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff
        run: python -m ruff check pipeline tests scripts
      # Unit tests only: tests that need CMS data are marked `data` and run in the deploy pipeline.
      - name: Pytest (unit, no data)
        run: python -m pytest -q -m "not data"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Vitest
        run: npx vitest run --passWithNoTests
      - name: Type-check and build
        run: npm run build
