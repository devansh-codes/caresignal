# CareSignal source registry. Used by pipeline/fetch.py and pipeline/validate.py.
# expected_columns come from the real CSV headers (verified 2026-10-24). PDC sources resolve
# metastore -> distribution[0].downloadURL; datacms sources resolve data.json -> title match -> newest year CSV.
