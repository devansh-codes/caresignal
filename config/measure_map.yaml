# CareSignal nursing-sensitive measure map (plan §4.3).
# category: nursing = nursing practice is the primary lever; shared = nursing is one of several
# accountable teams; other = primarily surgical/medical-staff driven.
# These are an informed judgment, documented here and shown as UI tooltips.
# Visible text (label, program, rationale, footnotes) follows docs/STYLE_GUIDE.md: plain words, no dashes.

measures:
  # ---------------- HAC Reduction Program (FY2026) ----------------
  - id: psi90
    label: Patient safety events (PSI 90)
    program: Hospital Acquired Condition Reduction Program
    category: shared
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      A combined score built from 10 safety events found in Medicare billing records. Two of them,
      pressure injuries (PSI 03) and falls that break a hip (PSI 08), depend heavily on nursing care.
      Most of the rest relate to surgery, so this measure is shared.
  - id: clabsi
    label: Central line infections (CLABSI)
    program: Hospital Acquired Condition Reduction Program
    category: nursing
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Prevented mainly by daily line care at the bedside: scrubbing the line hub, keeping dressings clean
      and dry, and asking every day whether the line is still needed. Nurses do and check this work.
  - id: cauti
    label: Catheter infections (CAUTI)
    program: Hospital Acquired Condition Reduction Program
    category: nursing
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Depends on how urinary catheters are inserted, cared for and removed. Protocols that let nurses
      remove catheters as soon as they are no longer needed are among the best known nursing quality practices.
  - id: ssi
    label: Surgical site infections (SSI, colon surgery and hysterectomy)
    program: Hospital Acquired Condition Reduction Program
    category: other
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Driven mostly by care around the operation: antibiotic timing, skin preparation, keeping patients
      warm and surgical technique. Nurses contribute through wound care after surgery.
  - id: cdi
    label: C. diff infections (CDI)
    program: Hospital Acquired Condition Reduction Program
    category: shared
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Depends on careful antibiotic use, room cleaning and testing practices, together with nursing
      isolation precautions and hand hygiene.
  - id: mrsa
    label: MRSA bloodstream infections
    program: Hospital Acquired Condition Reduction Program
    category: shared
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Prevented through hand hygiene, line care and programs that clear MRSA from patients' skin. Nursing,
      infection prevention and environmental services share this work.

  # ---------------- Healthcare Associated Infections (current file) ----------------
  - id: HAI_1
    label: Central line infections (CLABSI)
    program: Healthcare Associated Infections
    category: nursing
    direction: lower_better
    source: 77hc-ibv8
    rationale: Same reasoning as the central line measure in the penalty program. The value compares actual infections with the number expected.
  - id: HAI_2
    label: Catheter infections (CAUTI)
    program: Healthcare Associated Infections
    category: nursing
    direction: lower_better
    source: 77hc-ibv8
    rationale: Same reasoning as the catheter measure in the penalty program. The value compares actual infections with the number expected.
  - id: HAI_3
    label: Surgical site infections after colon surgery
    program: Healthcare Associated Infections
    category: other
    direction: lower_better
    source: 77hc-ibv8
    rationale: Driven mainly by the surgical team and care around the operation. Nurses contribute through wound care.
  - id: HAI_4
    label: Surgical site infections after abdominal hysterectomy
    program: Healthcare Associated Infections
    category: other
    direction: lower_better
    source: 77hc-ibv8
    rationale: Driven mainly by the surgical team and care around the operation. Nurses contribute through wound care.
  - id: HAI_5
    label: MRSA bloodstream infections
    program: Healthcare Associated Infections
    category: shared
    direction: lower_better
    source: 77hc-ibv8
    rationale: Shared by nursing, infection prevention and environmental services.
  - id: HAI_6
    label: C. diff infections (CDI)
    program: Healthcare Associated Infections
    category: shared
    direction: lower_better
    source: 77hc-ibv8
    rationale: Shared by the antibiotic stewardship team, environmental services and nursing isolation precautions.

  # ---------------- PSI 90 components ----------------
  - id: PSI_03
    label: Pressure injuries (PSI 03)
    program: Patient safety indicators
    category: nursing
    direction: lower_better
    source: muwa-iene
    rationale: >-
      Serious pressure injuries (stage 3 or worse) are prevented by turning patients, checking their skin
      and using the right mattresses. These are core nursing tasks.
  - id: PSI_06
    label: Collapsed lung caused by a procedure (PSI 06)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: A complication of procedures such as placing a central line. It depends mainly on the clinician doing the procedure.
  - id: PSI_08
    label: Falls in the hospital that break a hip (PSI 08)
    program: Patient safety indicators
    category: nursing
    direction: lower_better
    source: muwa-iene
    rationale: >-
      Fall risk checks, regular toileting rounds, bed alarms and help with walking are fall prevention
      practices that nurses lead.
  - id: PSI_09
    label: Bleeding after surgery (PSI 09)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Depends on surgical technique and how blood thinners are managed around the operation.
  - id: PSI_10
    label: Kidney injury needing dialysis after surgery (PSI 10)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Depends on managing blood pressure, fluids and medicines that can harm the kidneys around the operation.
  - id: PSI_11
    label: Breathing failure after surgery (PSI 11)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Mainly anesthesia and surgical factors. Nursing help with walking and breathing exercises also matters.
  - id: PSI_12
    label: Blood clots in the lungs or legs around surgery (PSI 12)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Doctors order the medicine that prevents clots. Getting patients up and walking early is the nursing contribution.
  - id: PSI_13
    label: Sepsis after surgery (PSI 13)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: A complication after surgery that depends mainly on the surgical team.
  - id: PSI_14
    label: Surgical wound reopening (PSI 14)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Surgical technique and the patient's own health matter most.
  - id: PSI_15
    label: Accidental cuts or tears during abdominal surgery (PSI 15)
    program: Patient safety indicators
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: A complication that happens during the operation itself.
  - id: PSI_90
    label: Patient safety events, combined score (PSI 90)
    program: Patient safety indicators
    category: shared
    direction: lower_better
    source: muwa-iene
    rationale: Combines the measures above, including pressure injuries (PSI 03) and falls that break a hip (PSI 08), which depend on nursing care.

  # ---------------- HCAHPS (top box percentages) ----------------
  - id: H_COMP_1_A_P
    label: Nurses always communicated well
    program: Patient survey (HCAHPS), counts toward Value Based Purchasing
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: >-
      Combines how often nurses were courteous, listened carefully and explained things clearly. It counts
      toward Medicare's Value Based Purchasing program, and nursing owns it directly.
  - id: H_NURSE_RESPECT_A_P
    label: Nurses always treated patients with courtesy and respect
    program: Patient survey (HCAHPS)
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: One part of the nurse communication score.
  - id: H_NURSE_LISTEN_A_P
    label: Nurses always listened carefully
    program: Patient survey (HCAHPS)
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: One part of the nurse communication score.
  - id: H_NURSE_EXPLAIN_A_P
    label: Nurses always explained things clearly
    program: Patient survey (HCAHPS)
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: One part of the nurse communication score.
  - id: H_COMP_6_Y_P
    label: Patients got information about going home
    program: Patient survey (HCAHPS), counts toward Value Based Purchasing
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: >-
      Nurses deliver most discharge teaching, together with case managers and doctors. It counts toward
      Medicare's Value Based Purchasing program.
  - id: H_DISCH_HELP_Y_P
    label: Staff discussed help needed after leaving
    program: Patient survey (HCAHPS)
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Part of discharge planning shared by nursing and case management.
  - id: H_SYMPTOMS_Y_P
    label: Patients were told what symptoms to watch for at home
    program: Patient survey (HCAHPS)
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Part of discharge teaching shared by nursing and the care team.
  - id: H_COMP_5_A_P
    label: Staff always explained new medicines
    program: Patient survey (HCAHPS), counts toward Value Based Purchasing
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Nurses explain medicines when they give them, together with pharmacists and prescribers.
  - id: H_COMP_2_A_P
    label: Doctors always communicated well
    program: Patient survey (HCAHPS), counts toward Value Based Purchasing
    category: other
    direction: higher_better
    source: dgck-syfz
    rationale: Owned mainly by physicians.
  - id: H_QUIET_HSP_A_P
    label: Area around the room was always quiet at night
    program: Patient survey (HCAHPS)
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Shaped by unit routines, grouping night care together and the building itself.
  - id: H_CLEAN_HSP_A_P
    label: Room and bathroom were always clean
    program: Patient survey (HCAHPS)
    category: other
    direction: higher_better
    source: dgck-syfz
    rationale: Mainly environmental services.
  - id: H_HSP_RATING_9_10
    label: Patients rated the hospital 9 or 10 out of 10
    program: Patient survey (HCAHPS), counts toward Value Based Purchasing
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: An overall rating that reflects the whole care team.
  - id: H_RECMND_DY
    label: Patients would definitely recommend the hospital
    program: Patient survey (HCAHPS)
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: An overall loyalty measure that reflects the whole care team.

  # ---------------- HRRP (FY2026) ----------------
  - id: READM-30-AMI-HRRP
    label: Heart attack readmissions (AMI)
    program: Hospital Readmissions Reduction Program
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Discharge teaching, checking medicines and booking follow up visits are shared work when patients go home.
  - id: READM-30-HF-HRRP
    label: Heart failure readmissions
    program: Hospital Readmissions Reduction Program
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Nurses teach patients to manage at home (daily weights, diet, water pills), and follow up after discharge is key.
  - id: READM-30-PN-HRRP
    label: Pneumonia readmissions
    program: Hospital Readmissions Reduction Program
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Shared work by nursing, doctors and case management as patients go home.
  - id: READM-30-COPD-HRRP
    label: COPD readmissions
    program: Hospital Readmissions Reduction Program
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Teaching inhaler technique and home action plans is led by nurses and respiratory therapists.
  - id: READM-30-CABG-HRRP
    label: Heart bypass surgery readmissions (CABG)
    program: Hospital Readmissions Reduction Program
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Shared by the surgical team and nursing as patients go home.
  - id: READM-30-HIP-KNEE-HRRP
    label: Hip or knee replacement readmissions
    program: Hospital Readmissions Reduction Program
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Shared by orthopedics, nursing and rehabilitation as patients go home.

  # ---------------- Timely & Effective Care ----------------
  - id: SEP_1
    label: Sepsis care bundle (SEP 1)
    program: Timely and effective care
    category: shared
    direction: higher_better
    source: yv7e-xc69
    rationale: >-
      Nurses screen patients for sepsis and help time each step of the bundle (lactate test, blood cultures,
      antibiotics, fluids) together with doctors and the lab.

# CMS Provider Data Catalog footnote crosswalk (dataset y9us-9xdf), retrieved 2026-10-24.
# Wording lightly edited to remove dashes; meaning unchanged.
footnotes:
  "1": The number of cases or patients is too few to report.
  "2": Data submitted were based on a sample of cases or patients.
  "3": Results are based on a shorter time period than required.
  "4": Data suppressed by CMS for one or more quarters.
  "5": Results are not available for this reporting period.
  "6": Fewer than 100 patients completed the CAHPS survey. Use these scores with caution, as the number of surveys may be too low to reliably assess facility performance.
  "7": No cases met the criteria for this measure.
  "8": The lower limit of the confidence interval cannot be calculated if the number of observed infections equals zero.
  "9": No data are available from the state or territory for this reporting period.
  "10": Very few patients were eligible for the CAHPS survey. The scores shown reflect fewer than 50 completed surveys. Use these scores with caution, as the number of surveys may be too low to reliably assess facility performance.
  "11": There were discrepancies in the data collection process.
  "12": This measure does not apply to this hospital for this reporting period.
  "13": Results cannot be calculated for this reporting period.
  "14": The results for this state are combined with nearby states to protect confidentiality.
  "15": The number of cases or patients is too few to report a star rating.
  "16": There are too few measures or measure groups reported to calculate a star rating or measure group score.
  "17": This hospital's star rating only includes data reported on inpatient services.
  "18": This result is not based on performance data; the hospital did not submit data and did not submit an HAI exemption form.
  "19": Data are shown only for hospitals that participate in the Inpatient Quality Reporting (IQR) and Outpatient Quality Reporting (OQR) programs.
  "20": State and national averages do not include Veterans Health Administration (VHA) hospital data.
  "21": Patient survey results for Veterans Health Administration (VHA) hospitals do not represent official HCAHPS results and are not included in state and national averages.
  "22": Overall star ratings are not calculated for Department of Defense (DoD) hospitals.
  "23": The data are based on claims that the hospital or facility submitted to CMS. The hospital or facility has reported discrepancies in their claims data.
  "24": Results for this Veterans Health Administration (VHA) hospital are combined with those from the VHA administrative parent hospital that manages all points of service.
  "25": State and national averages include Veterans Health Administration (VHA) hospital data.
  "26": State and national averages include Department of Defense (DoD) hospital data.
  "27": Retired
  "28": The results are based on the hospital or facility's data submissions. CMS approved the hospital or facility's Extraordinary Circumstances Exception request suggesting that results may be impacted.
  "29": This measure was calculated using partial performance period data due to an exception approved by CMS.
  "a": Maryland hospitals are waived from receiving payment adjustments under the Program.
  "*": For Maryland hospitals, no data are available to calculate a PSI 90 measure result; therefore, no performance decile or points are assigned for Domain 1 and the Total HAC score is dependent on the Domain 2 score.
  "**": This value was calculated using data reported by the hospital in compliance with the requirements outlined for this program and does not take into account information that became available at a later date.
