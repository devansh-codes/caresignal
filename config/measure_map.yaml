# CareSignal nursing-sensitive measure map (plan §4.3).
# category: nursing = nursing practice is the primary lever; shared = nursing is one of several
# accountable teams; other = primarily surgical/medical-staff driven.
# These are an informed judgment, documented here and shown as UI tooltips.

measures:
  # ---------------- HAC Reduction Program (FY2026) ----------------
  - id: psi90
    label: PSI 90 Patient Safety and Adverse Events Composite
    program: HAC
    category: shared
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Weighted composite of 10 claims-based safety indicators. Two components (pressure ulcer, PSI 03,
      and in-hospital fall with hip fracture, PSI 08) are classic nursing-sensitive outcomes; the rest are
      largely surgical, so the composite is shared.
  - id: clabsi
    label: Central line-associated bloodstream infection (CLABSI)
    program: HAC
    category: nursing
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Prevented chiefly by bedside line-maintenance bundles (hub scrubbing, dressing integrity, daily
      necessity review) that nurses perform and audit.
  - id: cauti
    label: Catheter-associated urinary tract infection (CAUTI)
    program: HAC
    category: nursing
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Driven by catheter insertion technique, maintenance and nurse-driven removal protocols, which are
      among the most established nursing-sensitive quality indicators.
  - id: ssi
    label: Surgical site infection (colon and abdominal hysterectomy)
    program: HAC
    category: other
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Determined mostly by perioperative practice (antibiotic timing, skin prep, normothermia, surgical
      technique), with nursing contributing to post-operative wound care.
  - id: cdi
    label: Clostridioides difficile infection (CDI)
    program: HAC
    category: shared
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Depends on antimicrobial stewardship, environmental cleaning and testing practice as well as
      nursing contact precautions and hand hygiene.
  - id: mrsa
    label: MRSA bacteremia
    program: HAC
    category: shared
    direction: lower_better
    source: yq43-i98g
    rationale: >-
      Prevented through hand hygiene, line care and decolonization programs owned jointly by nursing,
      infection prevention and environmental services.

  # ---------------- Healthcare-Associated Infections (current file) ----------------
  - id: HAI_1
    label: CLABSI SIR
    program: HAI
    category: nursing
    direction: lower_better
    source: 77hc-ibv8
    rationale: Same rationale as the HAC CLABSI measure; standardized infection ratio from NHSN.
  - id: HAI_2
    label: CAUTI SIR
    program: HAI
    category: nursing
    direction: lower_better
    source: 77hc-ibv8
    rationale: Same rationale as the HAC CAUTI measure; standardized infection ratio from NHSN.
  - id: HAI_3
    label: SSI – colon surgery SIR
    program: HAI
    category: other
    direction: lower_better
    source: 77hc-ibv8
    rationale: Perioperative and surgical-team driven; nursing contributes to wound care.
  - id: HAI_4
    label: SSI – abdominal hysterectomy SIR
    program: HAI
    category: other
    direction: lower_better
    source: 77hc-ibv8
    rationale: Perioperative and surgical-team driven; nursing contributes to wound care.
  - id: HAI_5
    label: MRSA bacteremia SIR
    program: HAI
    category: shared
    direction: lower_better
    source: 77hc-ibv8
    rationale: Shared between nursing, infection prevention and environmental services.
  - id: HAI_6
    label: C. difficile SIR
    program: HAI
    category: shared
    direction: lower_better
    source: 77hc-ibv8
    rationale: Shared between antimicrobial stewardship, environmental services and nursing precautions.

  # ---------------- PSI 90 components ----------------
  - id: PSI_03
    label: Pressure ulcer rate
    program: PSI
    category: nursing
    direction: lower_better
    source: muwa-iene
    rationale: >-
      Stage 3+ pressure injuries are prevented by repositioning, skin assessment and support surfaces,
      which are core nursing interventions.
  - id: PSI_06
    label: Iatrogenic pneumothorax rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Procedural complication (central line placement, thoracentesis) driven by proceduralists.
  - id: PSI_08
    label: In-hospital fall with hip fracture rate
    program: PSI
    category: nursing
    direction: lower_better
    source: muwa-iene
    rationale: >-
      Fall-risk assessment, toileting rounds, bed alarms and mobility support are nursing-led fall
      prevention practices.
  - id: PSI_09
    label: Postoperative hemorrhage or hematoma rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Surgical technique and perioperative anticoagulation management.
  - id: PSI_10
    label: Postoperative acute kidney injury requiring dialysis rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Driven by perioperative hemodynamic, fluid and nephrotoxin management.
  - id: PSI_11
    label: Postoperative respiratory failure rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Mainly anesthesia and surgical factors; nursing mobility and pulmonary care contribute.
  - id: PSI_12
    label: Perioperative pulmonary embolism or deep vein thrombosis rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: VTE prophylaxis ordering is medical-staff driven; early ambulation is a nursing contribution.
  - id: PSI_13
    label: Postoperative sepsis rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Surgical-team driven post-operative complication.
  - id: PSI_14
    label: Postoperative wound dehiscence rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Surgical technique and patient factors dominate.
  - id: PSI_15
    label: Abdominopelvic accidental puncture or laceration rate
    program: PSI
    category: other
    direction: lower_better
    source: muwa-iene
    rationale: Intra-operative surgical complication.
  - id: PSI_90
    label: PSI 90 composite (six-digit estimate)
    program: PSI
    category: shared
    direction: lower_better
    source: muwa-iene
    rationale: Composite of the components above; includes the nursing-sensitive PSI 03 and PSI 08.

  # ---------------- HCAHPS (top-box percentages) ----------------
  - id: H_COMP_1_A_P
    label: Nurse communication ("Always")
    program: HCAHPS / VBP
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: >-
      Composite of nurse courtesy/respect, listening and explaining. It is a VBP Person and Community
      Engagement dimension and is directly owned by nursing.
  - id: H_NURSE_RESPECT_A_P
    label: Nurses treated patients with courtesy and respect ("Always")
    program: HCAHPS
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: Component of the nurse communication composite.
  - id: H_NURSE_LISTEN_A_P
    label: Nurses listened carefully ("Always")
    program: HCAHPS
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: Component of the nurse communication composite.
  - id: H_NURSE_EXPLAIN_A_P
    label: Nurses explained things understandably ("Always")
    program: HCAHPS
    category: nursing
    direction: higher_better
    source: dgck-syfz
    rationale: Component of the nurse communication composite.
  - id: H_COMP_6_Y_P
    label: Discharge information ("Yes")
    program: HCAHPS / VBP
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: >-
      Discharge teaching is delivered largely by nurses alongside case management and physicians; it is
      a VBP Person and Community Engagement dimension.
  - id: H_DISCH_HELP_Y_P
    label: Discussed help needed after discharge ("Yes")
    program: HCAHPS
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Part of discharge planning shared by nursing and case management.
  - id: H_SYMPTOMS_Y_P
    label: Told what symptoms to watch for after discharge ("Yes")
    program: HCAHPS
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Part of discharge education shared by nursing and the care team.
  - id: H_COMP_5_A_P
    label: Communication about medicines ("Always")
    program: HCAHPS / VBP
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Medication teaching at administration is a nursing task shared with pharmacy and prescribers.
  - id: H_COMP_2_A_P
    label: Doctor communication ("Always")
    program: HCAHPS / VBP
    category: other
    direction: higher_better
    source: dgck-syfz
    rationale: Physician-owned communication composite.
  - id: H_QUIET_HSP_A_P
    label: Quiet at night ("Always")
    program: HCAHPS
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Influenced by unit routines, night-time care clustering and the physical environment.
  - id: H_CLEAN_HSP_A_P
    label: Room and bathroom clean ("Always")
    program: HCAHPS
    category: other
    direction: higher_better
    source: dgck-syfz
    rationale: Primarily environmental services.
  - id: H_HSP_RATING_9_10
    label: Overall hospital rating 9–10
    program: HCAHPS / VBP
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Global rating reflecting the whole care team.
  - id: H_RECMND_DY
    label: Would definitely recommend the hospital
    program: HCAHPS
    category: shared
    direction: higher_better
    source: dgck-syfz
    rationale: Global loyalty measure reflecting the whole care team.

  # ---------------- HRRP (FY2026) ----------------
  - id: READM-30-AMI-HRRP
    label: Acute myocardial infarction (AMI) readmissions
    program: HRRP
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Discharge education, medication reconciliation and follow-up scheduling are shared care-transition work.
  - id: READM-30-HF-HRRP
    label: Heart failure readmissions
    program: HRRP
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Nurse-led self-care teaching (weights, diet, diuretics) and transitions follow-up are key levers.
  - id: READM-30-PN-HRRP
    label: Pneumonia readmissions
    program: HRRP
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Shared care-transition work across nursing, medicine and case management.
  - id: READM-30-COPD-HRRP
    label: COPD readmissions
    program: HRRP
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Inhaler technique teaching and action plans are nursing and respiratory-therapy led.
  - id: READM-30-CABG-HRRP
    label: CABG surgery readmissions
    program: HRRP
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Shared surgical and nursing care-transition work.
  - id: READM-30-HIP-KNEE-HRRP
    label: Elective hip/knee replacement readmissions
    program: HRRP
    category: shared
    direction: lower_better
    source: 9n3s-kdb3
    rationale: Shared orthopedic, nursing and rehabilitation care-transition work.

  # ---------------- Timely & Effective Care ----------------
  - id: SEP_1
    label: Severe sepsis and septic shock management bundle (SEP-1)
    program: IQR
    category: shared
    direction: higher_better
    source: yv7e-xc69
    rationale: >-
      Nurse-driven screening and bundle timing (lactate, cultures, antibiotics, fluids) are shared with
      physicians and the lab.

# CMS Provider Data Catalog footnote crosswalk (dataset y9us-9xdf), retrieved 2026-10-24.
footnotes:
  "1": The number of cases/patients is too few to report.
  "2": Data submitted were based on a sample of cases/patients.
  "3": Results are based on a shorter time period than required.
  "4": Data suppressed by CMS for one or more quarters.
  "5": Results are not available for this reporting period.
  "6": Fewer than 100 patients completed the CAHPS survey. Use these scores with caution, as the number of surveys may be too low to reliably assess facility performance.
  "7": No cases met the criteria for this measure.
  "8": The lower limit of the confidence interval cannot be calculated if the number of observed infections equals zero.
  "9": No data are available from the state/territory for this reporting period.
  "10": Very few patients were eligible for the CAHPS survey. The scores shown reflect fewer than 50 completed surveys. Use these scores with caution, as the number of surveys may be too low to reliably assess facility performance.
  "11": There were discrepancies in the data collection process.
  "12": This measure does not apply to this hospital for this reporting period.
  "13": Results cannot be calculated for this reporting period.
  "14": The results for this state are combined with nearby states to protect confidentiality.
  "15": The number of cases/patients is too few to report a star rating.
  "16": There are too few measures or measure groups reported to calculate a star rating or measure group score.
  "17": This hospital's star rating only includes data reported on inpatient services.
  "18": This result is not based on performance data; the hospital did not submit data and did not submit an HAI exemption form.
  "19": Data are shown only for hospitals that participate in the Inpatient Quality Reporting (IQR) and Outpatient Quality Reporting (OQR) programs.
  "20": State and national averages do not include Veterans Health Administration (VHA) hospital data.
  "21": Patient survey results for Veterans Health Administration (VHA) hospitals do not represent official HCAHPS results and are not included in state and national averages.
  "22": Overall star ratings are not calculated for Department of Defense (DoD) hospitals.
  "23": The data are based on claims that the hospital or facility submitted to CMS. The hospital or facility has reported discrepancies in their claims data.
  "24": Results for this Veterans Health Administration (VHA) hospital are combined with those from the VHA administrative parent hospital that manages all points of service.
  "25": State and national averages include Veterans Health Administration (VHA) hospital data.
  "26": State and national averages include Department of Defense (DoD) hospital data.
  "27": Retired
  "28": The results are based on the hospital or facility's data submissions. CMS approved the hospital or facility's Extraordinary Circumstances Exception request suggesting that results may be impacted.
  "29": This measure was calculated using partial performance period data due to a CMS-approved exception.
  "a": Maryland hospitals are waived from receiving payment adjustments under the Program.
  "*": For Maryland hospitals, no data are available to calculate a PSI 90 measure result; therefore, no performance decile or points are assigned for Domain 1 and the Total HAC score is dependent on the Domain 2 score.
  "**": This value was calculated using data reported by the hospital in compliance with the requirements outlined for this program and does not take into account information that became available at a later date.
